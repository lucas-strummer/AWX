---
- name: Aprovisionar una cuenta Linux administrada por JumpServer
  hosts: all
  become: true
  gather_facts: true
  serial: 20

  vars:
    managed_user_sudo: false
    managed_user_shell: /bin/bash
    managed_user_lock_password: true
    managed_user_authorized_key_exclusive: true
    managed_user_restrict_to_jumpserver: true
    jumpserver_source_ip: "10.100.100.84"

  pre_tasks:
    - name: Validar la plataforma y las variables requeridas
      ansible.builtin.assert:
        that:
          - ansible_system == "Linux"
          - (managed_user | default('')) is match('^[a-z_][a-z0-9_-]{0,31}$')
          - (managed_user_public_key | default('') | trim) is match('^ssh-(ed25519|rsa|ecdsa-[^ ]+) [A-Za-z0-9+/]+={0,3}( .*)?$')
          - not (managed_user_restrict_to_jumpserver | bool) or jumpserver_source_ip is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
        fail_msg: >-
          El destino debe ser Linux. Indique managed_user con un nombre Unix
          válido y managed_user_public_key con una clave pública OpenSSH válida.

    - name: Consultar si el usuario ya existe
      ansible.builtin.getent:
        database: passwd
        key: "{{ managed_user }}"
        fail_key: false

    - name: Registrar si el usuario ya existía
      ansible.builtin.set_fact:
        managed_user_exists: >-
          {{ managed_user in (ansible_facts.getent_passwd | default({})) }}

  tasks:
    - name: Crear el grupo primario para un usuario nuevo
      ansible.builtin.group:
        name: "{{ managed_user }}"
        state: present
      when: not managed_user_exists

    - name: Crear el usuario cuando no existe
      ansible.builtin.user:
        name: "{{ managed_user }}"
        comment: Cuenta administrada por JumpServer
        group: "{{ managed_user }}"
        shell: "{{ managed_user_shell }}"
        create_home: true
        password_lock: true
        state: present
      when: not managed_user_exists

    - name: Bloquear la contraseña de un usuario existente
      ansible.builtin.user:
        name: "{{ managed_user }}"
        password_lock: true
        state: present
      when:
        - managed_user_exists
        - managed_user_lock_password | bool

    - name: Instalar la clave pública autorizada
      ansible.posix.authorized_key:
        user: "{{ managed_user }}"
        key: "{{ managed_user_public_key | trim }}"
        key_options: >-
          {{ ('from="' + jumpserver_source_ip + '",no-agent-forwarding,no-port-forwarding,no-X11-forwarding,no-user-rc')
             if (managed_user_restrict_to_jumpserver | bool) else omit }}
        state: present
        exclusive: "{{ managed_user_authorized_key_exclusive | bool }}"
        manage_dir: true
      no_log: true

    - name: Conceder sudo completo sin contraseña
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/jumpserver-{{ managed_user }}"
        owner: root
        group: root
        mode: "0440"
        content: "{{ managed_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
        validate: "/usr/sbin/visudo -cf %s"
      when: managed_user_sudo | bool

    - name: Retirar la regla sudo administrada por este playbook
      ansible.builtin.file:
        path: "/etc/sudoers.d/jumpserver-{{ managed_user }}"
        state: absent
      when: not (managed_user_sudo | bool)

    - name: Consultar el estado de la contraseña
      ansible.builtin.command:
        cmd: "passwd -S {{ managed_user }}"
      register: managed_user_password_status
      changed_when: false
      check_mode: false

    - name: Informar el resultado
      ansible.builtin.debug:
        msg:
          - "Usuario administrado: {{ managed_user }}"
          - "Usuario preexistente: {{ managed_user_exists }}"
          - "Sudo NOPASSWD administrado: {{ managed_user_sudo | bool }}"
          - "Estado de contraseña: {{ managed_user_password_status.stdout }}"
