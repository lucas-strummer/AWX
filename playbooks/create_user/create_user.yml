---
- name: Crear usuario administrado
  hosts: all
  become: true
  vars:
    managed_user: svc_ansible
    managed_user_groups:
      - sudo
  tasks:
    - name: Crear usuario sin almacenar credenciales en Git
      ansible.builtin.user:
        name: "{{ managed_user }}"
        groups: "{{ managed_user_groups }}"
        append: true
        state: present
        shell: /bin/bash
        create_home: true
        password: "{{ managed_user_password_hash | default(omit) }}"
      no_log: "{{ managed_user_password_hash is defined }}"
