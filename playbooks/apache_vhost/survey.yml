---
name: Alta de vhost Apache
description: Datos necesarios para publicar un vhost HTTPS con proxy reverso.
spec:
  - question_name: Server Name del vhost
    question_description: Hostname público, sin http://, puerto ni ruta.
    required: true
    type: text
    variable: apache_vhost_server_name
    min: 1
    max: 253
    default: ''
  - question_name: Destino del proxy
    question_description: URL del backend, por ejemplo http://172.20.40.24:8300/
    required: true
    type: text
    variable: apache_vhost_proxy_url
    min: 8
    max: 255
    default: ''
