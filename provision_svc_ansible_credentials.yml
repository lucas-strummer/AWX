---
- name: Generar y almacenar las credenciales de svc_ansible en AWX
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    svc_ansible_user: svc_ansible
    svc_ansible_machine_credential_name: "svc_ansible SSH"
    svc_ansible_public_credential_type_name: "svc_ansible Public Key Type"
    svc_ansible_public_credential_name: "svc_ansible Public Key"
    svc_ansible_organization: "Default"
    svc_ansible_key_type: ed25519
    svc_ansible_key_comment: "svc_ansible@awx"
    svc_ansible_confirm_generation: false
    controller_host_from_env: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
    controller_token_from_env: "{{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"

  pre_tasks:
    - name: Exigir confirmación explícita para generar o rotar la clave
      ansible.builtin.assert:
        that:
          - svc_ansible_confirm_generation | bool
        fail_msg: >-
          Esta operación genera una clave nueva y reemplaza las credenciales de
          AWX. Ejecútela con svc_ansible_confirm_generation=true solamente para
          el alta inicial o una rotación intencional.

    - name: Validar la configuración de acceso a la API de AWX
      ansible.builtin.assert:
        that:
          - controller_host_from_env | length > 0
          - controller_token_from_env | length > 0
          - svc_ansible_organization | length > 0
        fail_msg: >-
          Adjunte una credencial de API que inyecte CONTROLLER_HOST y
          CONTROLLER_OAUTH_TOKEN, y verifique svc_ansible_organization.

  tasks:
    - name: Crear directorio temporal protegido
      ansible.builtin.tempfile:
        state: directory
        prefix: svc_ansible_
      register: svc_key_tempdir

    - name: Generar y almacenar las credenciales
      block:
        - name: Generar par de claves SSH
          community.crypto.openssh_keypair:
            path: "{{ svc_key_tempdir.path }}/id_{{ svc_ansible_key_type }}"
            type: "{{ svc_ansible_key_type }}"
            comment: "{{ svc_ansible_key_comment }}"
            mode: "0600"
            regenerate: full_idempotence
          no_log: true

        - name: Leer la clave privada
          ansible.builtin.slurp:
            src: "{{ svc_key_tempdir.path }}/id_{{ svc_ansible_key_type }}"
          register: svc_private_key_file
          no_log: true

        - name: Leer la clave pública
          ansible.builtin.slurp:
            src: "{{ svc_key_tempdir.path }}/id_{{ svc_ansible_key_type }}.pub"
          register: svc_public_key_file
          no_log: true

        - name: Crear el tipo de credencial para la clave pública
          awx.awx.credential_type:
            name: "{{ svc_ansible_public_credential_type_name }}"
            description: "Clave pública SSH de svc_ansible, almacenada en AWX"
            kind: cloud
            state: present
            inputs:
              fields:
                - id: svc_ansible_public_key
                  type: string
                  label: Clave pública SSH
                  secret: true
              required:
                - svc_ansible_public_key
            injectors:
              extra_vars:
                svc_ansible_public_key: !unsafe "{{ svc_ansible_public_key }}"

        - name: Guardar la clave privada en la credencial Machine
          awx.awx.credential:
            name: "{{ svc_ansible_machine_credential_name }}"
            organization: "{{ svc_ansible_organization }}"
            credential_type: Machine
            state: present
            update_secrets: true
            inputs:
              username: "{{ svc_ansible_user }}"
              ssh_key_data: "{{ svc_private_key_file.content | b64decode }}"
          no_log: true

        - name: Guardar la clave pública en una credencial de AWX
          awx.awx.credential:
            name: "{{ svc_ansible_public_credential_name }}"
            organization: "{{ svc_ansible_organization }}"
            credential_type: "{{ svc_ansible_public_credential_type_name }}"
            state: present
            update_secrets: true
            inputs:
              svc_ansible_public_key: >-
                {{ svc_public_key_file.content | b64decode | trim }}
          no_log: true

        - name: Confirmar la creación de las credenciales
          ansible.builtin.debug:
            msg: >-
              Se crearon o rotaron '{{ svc_ansible_machine_credential_name }}' y
              '{{ svc_ansible_public_credential_name }}' en AWX.

      always:
        - name: Eliminar el par de claves temporal
          ansible.builtin.file:
            path: "{{ svc_key_tempdir.path }}"
            state: absent
          when: svc_key_tempdir.path is defined
          no_log: true

